[project]
name = "whatsapp-mcp-server"
version = "0.6.0"
description = "WhatsApp integration for Claude via Model Context Protocol (MCP)"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Very Good Plugins", email = "support@verygoodplugins.com" }
]
keywords = ["whatsapp", "mcp", "claude", "ai", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Upstream caps this at <49, because cryptography 49+ stopped publishing
    # Intel macOS wheels and they want the developer-laptop install to keep
    # working. That cap now holds back the fix for CVE-2026-69247 (PKCS#7,
    # HIGH), and this fork exists to ship a linux/amd64 container
    # (docs/adr/0002-amd64-only.md), where Intel macOS wheels are irrelevant.
    # Floor is the fixed version so the CVE cannot reappear. Not imported
    # anywhere in this package — it arrives via the MCP SDK.
    "cryptography>=50.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1,<2",
    "requests>=2.34.2",
    "anyio<4.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]

[project.urls]
Homepage = "https://github.com/verygoodplugins/whatsapp-mcp"
Repository = "https://github.com/verygoodplugins/whatsapp-mcp"
Issues = "https://github.com/verygoodplugins/whatsapp-mcp/issues"

[tool.setuptools]
py-modules = ["main", "whatsapp", "audio", "mcp_config", "parent_watchdog"]

[tool.mcp]
name = "io.github.verygoodplugins/whatsapp-mcp"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
