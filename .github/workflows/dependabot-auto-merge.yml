name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# Must cover everything the reusable workflow declares (it also asks for
# issues: write, to create labels); a callee requesting more than the caller
# grants is a startup_failure on every PR, Dependabot or not.
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    uses: verygoodplugins/.github/.github/workflows/dependabot-auto-merge.yml@main
